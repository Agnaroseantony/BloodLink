<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Something needs attention')}"></head><body class="error-body"><main class="glass error-card"><a class="brand" th:href="@{/}"><span class="brand-mark">♥</span> BloodLink.</a><span class="empty-icon">ⓘ</span><p class="eyebrow" th:text="${status != null ? 'ERROR ' + status : 'PLEASE CHECK THIS ACTION'}"></p><h1 th:text="${errorTitle != null ? errorTitle : 'We couldn’t open that page.'}"></h1><p th:text="${errorMessage != null ? errorMessage : 'The page may be unavailable, the form may be invalid, or your session may have ended. Return to your workspace and try again.'}"></p><a class="button" th:href="@{/dashboard}">Return to workspace ↗</a><a class="text-link" th:href="@{/login}">Sign in</a></main></body></html>
