spring.application.name=BloodLink
spring.datasource.url=jdbc:h2:file:./data/bloodlink;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
# Cloud-only integrations stay disabled in the local teaching setup.
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.seed-demo=${SEED_DEMO:true}
app.map.tile-url=${MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
app.map.attribution=${MAP_ATTRIBUTION:OpenStreetMap contributors}
app.map.attribution-url=${MAP_ATTRIBUTION_URL:https://www.openstreetmap.org/copyright}
